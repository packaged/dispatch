defaults: &defaults
  steps:
    # Install runtime and test extensions before resolving Composer dependencies.
    - run:
        name: Install PHP extensions
        command: |
          apk add --no-cache $PHPIZE_DEPS curl git unzip
          pecl install apcu
          docker-php-ext-enable apcu
          echo 'apc.enable_cli=1' > /usr/local/etc/php/conf.d/apcu-cli.ini
          echo 'date.timezone=UTC' > /usr/local/etc/php/conf.d/timezone.ini
    - run: curl -fsS https://getcomposer.org/installer | php -- --install-dir=/usr/bin --filename=composer

    # pre-checkout steps

    # checkout
    - checkout

    # post-checkout steps

    # run tests
    - run: composer install -n --prefer-dist
    - run: composer audit
    - run: php vendor/phpunit/phpunit/phpunit -c phpunit.xml --log-junit /tmp/test-results/phpunit/junit.xml
    - store_test_results:
        path: /tmp/test-results

version: 2
jobs:
  build-php82:
    <<: *defaults
    docker:
      - image: php:8.2-alpine
  build-php83:
    <<: *defaults
    docker:
      - image: php:8.3-alpine
  build-php84:
    <<: *defaults
    docker:
      - image: php:8.4-alpine

workflows:
  version: 2
  build:
    jobs:
      - build-php82
      - build-php83
      - build-php84
